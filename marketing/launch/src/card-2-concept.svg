<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- 02 · 컨셉 -->
  <rect width="1080" height="1080" fill="#FAF7F2"/>
  <rect x="48" y="48" width="984" height="984" fill="none" stroke="#EDE8DE" stroke-width="2"/>

  <text x="110" y="232" font-family="JetBrains Mono" font-size="28" letter-spacing="6"
        fill="#B8956A">WHY THE ONE</text>

  <!-- headline -->
  <text font-family="Noto Serif KR" font-size="72" font-weight="600"
        letter-spacing="-2" fill="#1A1F2E">
    <tspan x="110" y="380">결혼정보회사가</tspan>
    <tspan x="110" y="478">디지털로 옮긴다면.</tspan>
  </text>

  <!-- body -->
  <text font-family="Pretendard Variable" font-size="36" font-weight="400"
        letter-spacing="-1" fill="#8B8378">
    <tspan x="110" y="640">수십 년간 오프라인 상담실에서만</tspan>
    <tspan x="110" y="700">가능했던 ‘검증된 만남’을,</tspan>
    <tspan x="110" y="760">더원은 디지털로 옮깁니다.</tspan>
  </text>

  <line x1="110" y1="868" x2="250" y2="868" stroke="#B8956A" stroke-width="2"/>
  <text x="110" y="936" font-family="Pretendard Variable" font-size="30" font-weight="500"
        letter-spacing="-1" fill="#1A1F2E">28–42세 · 전문직 · 진지한 만남</text>

  <text x="1000" y="988" font-family="JetBrains Mono" font-size="24" letter-spacing="2"
        fill="#8B8378" text-anchor="end">02 / 05</text>
</svg>
