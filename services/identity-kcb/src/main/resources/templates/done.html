<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>본인확인 완료</title>
  <style>
    html,body{margin:0;height:100%;background:#FAF7F2;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#1A1F2E}
    .wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:10px;padding:24px;text-align:center}
    .badge{width:40px;height:40px;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
    .ok{background:#6B8E7F}.fail{background:#A85547}
    h1{font-size:17px;margin:4px 0 0}
    p{font-size:13px;color:#6B7280;margin:0}
  </style>
</head>
<body>
  <!--
    완료 랜딩. 앱 WebView 는 이 경로(/kcb/done)를 감지해 즉시 닫고
    백엔드(/api/identity/kcb/result)로 txSeqNo 결과를 조회한다.
    브라우저 팝업은 스스로 닫힌다.
  -->
  <div class="wrap">
    <div th:classappend="${status == 'ok'} ? 'ok' : 'fail'" class="badge" th:text="${status == 'ok'} ? '✓' : '!'">✓</div>
    <h1 th:text="${status == 'ok'} ? '본인확인이 완료되었습니다' : '본인확인에 실패했습니다'">본인확인이 완료되었습니다</h1>
    <p>앱으로 돌아가는 중입니다…</p>
  </div>
  <script th:inline="javascript">
    var txSeqNo = /*[[${txSeqNo}]]*/ "";
    var status  = /*[[${status}]]*/ "fail";
    try {
      if (window.opener) {
        window.opener.postMessage({ source: "kcb-identity", txSeqNo: txSeqNo, status: status }, "*");
      }
    } catch (e) {}
    // 앱 WebView 의 onNavigationStateChange 가 이미 이 URL 을 가로챘다면 닫힘 처리됨.
    setTimeout(function () { try { window.close(); } catch (e) {} }, 300);
  </script>
</body>
</html>
